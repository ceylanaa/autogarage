spring.application.name=autogarage
server.port=8080

# database (postgres) - pas aan via environment variabelen als je andere gegevens hebt
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/autogarage}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# jpa / hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# data.sql uitvoeren na het aanmaken van de tabellen
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# jwt
jwt.secret=${JWT_SECRET:ditIsEenHeelLangGeheimVoorDeAutogarageEindopdrachtVanNovi2025MinstensTweeHonderdZesenvijftigBits}
# 1 dag in milliseconden
jwt.expiration=86400000

# upload van autopapieren
upload.dir=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
