# testprofiel: H2 in-memory database zodat je geen postgres nodig hebt voor de tests
spring.datasource.url=jdbc:h2:mem:autogaragetest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

jwt.secret=testGeheimVoorDeAutogarageTestsDatLangGenoegMoetZijnVoorHmacSha256Algoritme
jwt.expiration=3600000

upload.dir=./target/test-uploads
